name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: pip install -e '.[dev]'
      - run: ruff check .
      - run: mypy app
      - run: pytest

  postgres-integration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: agent
          POSTGRES_PASSWORD: agent
          POSTGRES_DB: agent
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U agent -d agent"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://agent:agent@localhost:5432/agent
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: pip install -e '.[dev]'
      - name: Verify migration round trip
        run: |
          alembic upgrade head
          alembic check
          alembic downgrade base
          alembic upgrade head
          alembic check
      - name: Run test suite against PostgreSQL
        run: pytest

  docker-smoke:
    needs: [quality, postgres-integration]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate Compose configuration
        run: docker compose config --quiet
      - name: Build and start complete stack
        run: docker compose up -d --build
      - name: Exercise API, PostgreSQL and worker end to end
        run: bash scripts/smoke_test.sh
      - name: Show service state
        if: always()
        run: docker compose ps -a
      - name: Show logs on failure
        if: failure()
        run: docker compose logs --no-color
      - name: Tear down stack
        if: always()
        run: docker compose down -v --remove-orphans
